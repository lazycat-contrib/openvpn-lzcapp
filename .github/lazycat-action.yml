version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/openvpn.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: openvpn

build:
  run_buildscript: false

images:
  # 上游 czyt/openvpn 有完整三段 SemVer tag（v2.1.0 等）
  - id: openvpn
    target: service
    service: openvpn
    source: czyt/openvpn
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Openvpn
    summary: "OpenVPN 是一个开源VPN服务器"
